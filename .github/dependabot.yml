version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    # Keep at most one open Dependabot PR at a time to avoid a pile-up.
    open-pull-requests-limit: 1
    groups:
      # CI runs on macOS runners, so one PR per action bump would mean one full
      # macOS build+test cycle each. Bundle them into a single PR instead.
      actions:
        patterns:
          - "*"

  # No external Swift dependencies today (Core is a local package, the .xcodeproj
  # has no remote package references), so this produces no PRs yet. It's here so a
  # future external dependency is picked up automatically. `directories` covers both
  # SwiftPM manifest locations: the Xcode project at the root and the Core package.
  - package-ecosystem: "swift"
    directories:
      - "/"
      - "/Core"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 1
    groups:
      swift:
        patterns:
          - "*"
